# Optional snake and languages images retained for manual generation.
# These images are no longer displayed in the profile overview.

name: Profile assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#D9971A&color_dots=#ebedf0,#c6e6de,#9ad0c3,#6FB7A7,#3f8f7e
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5B942&color_dots=#161b22,#1d3b36,#2f6158,#4f917f,#6FB7A7

      - name: Generate languages card
        run: python3 .github/scripts/languages.py "${{ github.repository_owner }}" dist/languages.svg
        env:
          # Optional: save a read-only personal access token as the LANGS_TOKEN
          # secret to count private repos too. Without it, public repos only.
          GITHUB_TOKEN: ${{ secrets.LANGS_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.LANGS_TOKEN != '' }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
