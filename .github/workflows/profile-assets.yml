# Builds the README's generated images and publishes them to the `output` branch:
#   snake-dark.svg / snake-light.svg  contribution-graph snake
#   languages.svg                     most used languages across public repos
# Everything must be built in this one run: publishing replaces the whole branch.

name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *"          # 06:00 EAT daily
  workflow_dispatch:              # manual trigger
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - ".github/scripts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#D9971A&color_dots=#ebedf0,#c6e6de,#9ad0c3,#6FB7A7,#3f8f7e
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5B942&color_dots=#161b22,#1d3b36,#2f6158,#4f917f,#6FB7A7

      - name: Generate languages card
        run: python3 .github/scripts/languages.py "${{ github.repository_owner }}" dist/languages.svg
        env:
          # Optional: save a read-only personal access token as the LANGS_TOKEN
          # secret to count private repos too. Without it, public repos only.
          GITHUB_TOKEN: ${{ secrets.LANGS_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.LANGS_TOKEN != '' }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
