# Draws the contribution-graph snake and publishes it to the `output` branch.
# README.md embeds output/snake-dark.svg and output/snake-light.svg from there.

name: Snake

on:
  schedule:
    - cron: "0 3 * * *"          # 06:00 EAT daily
  workflow_dispatch:              # manual trigger
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#D9971A&color_dots=#ebedf0,#c6e6de,#9ad0c3,#6FB7A7,#3f8f7e
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5B942&color_dots=#161b22,#1d3b36,#2f6158,#4f917f,#6FB7A7

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
