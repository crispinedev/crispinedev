<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" role="img" aria-label="Most used languages: HTML 34.5%, TypeScript 33.7%, CSS 11.1%, JavaScript 8.5%, Python 6.7%, Other 5.4%">
  <style>
    .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
    .ink { fill: #F2EFE9; } .dim { fill: #8A93A6; } .amber { fill: #F5B942; }
    .item { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .item { animation: none; } }
  </style>
  <defs>
    <clipPath id="bar">
      <rect x="25" y="58" width="445" height="10" rx="5">
        <animate attributeName="width" from="0" to="445" dur="1.2s" calcMode="spline" keySplines=".2 .7 .2 1" keyTimes="0;1" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="495" height="195" rx="12" fill="#0B1220"/>
  <text x="25" y="38" class="mono amber" font-size="13" letter-spacing="2.5">MOST USED LANGUAGES</text>
  <rect x="25" y="58" width="445" height="10" rx="5" fill="#1A2436"/>
  <g clip-path="url(#bar)"><rect x="25.00" y="58" width="154.24" height="10" fill="#E34C26"/><rect x="178.74" y="58" width="150.42" height="10" fill="#3178C6"/><rect x="328.66" y="58" width="49.72" height="10" fill="#9B6FD6"/><rect x="377.88" y="58" width="38.51" height="10" fill="#F1E05A"/><rect x="415.89" y="58" width="30.49" height="10" fill="#D97757"/><rect x="445.88" y="58" width="24.62" height="10" fill="#F5B942"/></g>
  <g class="item" style="animation-delay:0.50s"><circle cx="30" cy="98" r="5" fill="#E34C26"/><text x="43" y="102" class="sans ink" font-size="13">HTML</text><text x="230" y="102" text-anchor="end" class="mono dim" font-size="12">34.5%</text></g><g class="item" style="animation-delay:0.62s"><circle cx="265" cy="98" r="5" fill="#3178C6"/><text x="278" y="102" class="sans ink" font-size="13">TypeScript</text><text x="465" y="102" text-anchor="end" class="mono dim" font-size="12">33.7%</text></g><g class="item" style="animation-delay:0.74s"><circle cx="30" cy="130" r="5" fill="#9B6FD6"/><text x="43" y="134" class="sans ink" font-size="13">CSS</text><text x="230" y="134" text-anchor="end" class="mono dim" font-size="12">11.1%</text></g><g class="item" style="animation-delay:0.86s"><circle cx="265" cy="130" r="5" fill="#F1E05A"/><text x="278" y="134" class="sans ink" font-size="13">JavaScript</text><text x="465" y="134" text-anchor="end" class="mono dim" font-size="12">8.5%</text></g><g class="item" style="animation-delay:0.98s"><circle cx="30" cy="162" r="5" fill="#D97757"/><text x="43" y="166" class="sans ink" font-size="13">Python</text><text x="230" y="166" text-anchor="end" class="mono dim" font-size="12">6.7%</text></g><g class="item" style="animation-delay:1.10s"><circle cx="265" cy="162" r="5" fill="#F5B942"/><text x="278" y="166" class="sans ink" font-size="13">Other</text><text x="465" y="166" text-anchor="end" class="mono dim" font-size="12">5.4%</text></g>
</svg>
