<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195" role="img" aria-label="Most used languages: TypeScript 56.5%, HTML 20.1%, CSS 9.2%, JavaScript 6.3%, SCSS 3.9%, Other 4.1%">
  <style>
    .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }
    .ink { fill: #F2EFE9; } .dim { fill: #8A93A6; } .amber { fill: #F5B942; }
    .item { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .item { animation: none; } }
  </style>
  <defs>
    <clipPath id="bar">
      <rect x="25" y="58" width="445" height="10" rx="5">
        <animate attributeName="width" from="0" to="445" dur="1.2s" calcMode="spline" keySplines=".2 .7 .2 1" keyTimes="0;1" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="495" height="195" rx="12" fill="#0B1220"/>
  <text x="25" y="38" class="mono amber" font-size="13" letter-spacing="2.5">MOST USED LANGUAGES</text>
  <rect x="25" y="58" width="445" height="10" rx="5" fill="#1A2436"/>
  <g clip-path="url(#bar)"><rect x="25.00" y="58" width="251.72" height="10" fill="#3178C6"/><rect x="276.22" y="58" width="89.78" height="10" fill="#E34C26"/><rect x="365.50" y="58" width="41.57" height="10" fill="#9B6FD6"/><rect x="406.57" y="58" width="28.35" height="10" fill="#F1E05A"/><rect x="434.42" y="58" width="18.05" height="10" fill="#C6538C"/><rect x="451.97" y="58" width="18.53" height="10" fill="#F5B942"/></g>
  <g class="item" style="animation-delay:0.50s"><circle cx="30" cy="98" r="5" fill="#3178C6"/><text x="43" y="102" class="sans ink" font-size="13">TypeScript</text><text x="230" y="102" text-anchor="end" class="mono dim" font-size="12">56.5%</text></g><g class="item" style="animation-delay:0.62s"><circle cx="265" cy="98" r="5" fill="#E34C26"/><text x="278" y="102" class="sans ink" font-size="13">HTML</text><text x="465" y="102" text-anchor="end" class="mono dim" font-size="12">20.1%</text></g><g class="item" style="animation-delay:0.74s"><circle cx="30" cy="130" r="5" fill="#9B6FD6"/><text x="43" y="134" class="sans ink" font-size="13">CSS</text><text x="230" y="134" text-anchor="end" class="mono dim" font-size="12">9.2%</text></g><g class="item" style="animation-delay:0.86s"><circle cx="265" cy="130" r="5" fill="#F1E05A"/><text x="278" y="134" class="sans ink" font-size="13">JavaScript</text><text x="465" y="134" text-anchor="end" class="mono dim" font-size="12">6.3%</text></g><g class="item" style="animation-delay:0.98s"><circle cx="30" cy="162" r="5" fill="#C6538C"/><text x="43" y="166" class="sans ink" font-size="13">SCSS</text><text x="230" y="166" text-anchor="end" class="mono dim" font-size="12">3.9%</text></g><g class="item" style="animation-delay:1.10s"><circle cx="265" cy="162" r="5" fill="#F5B942"/><text x="278" y="166" class="sans ink" font-size="13">Other</text><text x="465" y="166" text-anchor="end" class="mono dim" font-size="12">4.1%</text></g>
</svg>
